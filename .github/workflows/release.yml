name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          KS_TAG: build-${{ github.run_number }}

      # Publish the built tree to the `release` branch: start from main's tree,
      # force-add dist/, commit, and force-push. main is never modified.
      - name: Publish to release branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          git add -f dist
          git commit -m "release ${TAG}"
          git push -f origin release
          git tag "${TAG}"
          git push origin "${TAG}"

      # The test channel reads the newest tag from dist/manifest.json on the
      # `release` branch (ADR 0003). Tag URLs are immutable and cached forever;
      # branch URLs are not, so without this the manifest can serve the previous
      # build's tag for hours and a merged PR stays invisible on test.
      #
      # Best effort by design: a failed purge means the tag appears late, which
      # the 60 s Settings cache and the stable_tag fallback both survive. It is
      # not worth failing a release that has already been built and tagged.
      - name: Purge the jsDelivr cache for the release manifest
        continue-on-error: true
        run: |
          set -uo pipefail
          URL="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/dist/manifest.json"
          echo "Purging ${URL}"
          CODE=$(curl -sS -o /tmp/purge.json -w '%{http_code}' --max-time 30 "${URL}" || echo "000")
          echo "HTTP ${CODE}"
          cat /tmp/purge.json || true
          echo
          if [ "${CODE}" != "200" ]; then
            echo "::warning::jsDelivr purge returned ${CODE}; the manifest may serve a stale tag until its own TTL expires."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '```json'
            cat dist/manifest.json
            echo '```'
          } > release-notes.md
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --target release
